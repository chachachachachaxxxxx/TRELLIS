# 方法配置文件示例

# Edit3D-Bench GT 数据根目录
gt_root: /home/wangxinxing/code/Edit3Dpp/data

# 方法名称
method_name: image_p2p_latent_blend

# 配置名称（用于标识不同的参数配置）
config_name: dollhouse_no_p2p

# 数据集过滤
# dataset: GSO  # 可选：GSO, PartObjaverse-Tiny
# object: 3D_Dollhouse_Happy_Brother  # 可选：指定物体名称
# prompt_id: 1  # 可选：1, 2, 3
# max_cases: 10  # 可选：限制案例数量

# 基础参数
seed: 1
device: cuda:0

# Assets 路径（可选，如果有预处理的 assets）
assets_root: /cache/wangxinxing/data/temp/renders

# 评测参数
metrics:
  - psnr
  - ssim
  - lpips
  - fid
  - dino_if
  - chamfer
  - clip_t

skip_render: false

# 方法参数（传递给 run_edit_experiment.py）
method_args:
  ss-steps: 25
  slat-steps: 25
  inject-stages: ""  # 空字符串表示禁用 P2P
  blend-ss-enabled: true
  blend-slat-enabled: true
  ss-blend-mode: soft
  slat-blend-mode: soft
  ss-soft-kernel-size: 5
  slat-soft-kernel-size: 7
