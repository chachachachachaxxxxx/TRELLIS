# ============================================================
# p2p_latent_blend_ss — 与 edit_example 资源对齐的单次实验
#
# 在仓库 TRELLIS_EDIT 目录下执行:
#   python run_edit_experiment.py --config edit_configs/ss_examples/edit_example.yaml
#
# CLI 等价命令:
#   python run_edit_experiment.py --entrypoint p2p_latent_blend_ss \
#     --source-image assets/edit_example/images/2d_render.png \
#     --edit-image assets/edit_example/images/2d_edit.png \
#     --mask-image assets/edit_example/images/2d_mask.png \
#     --mask-glb assets/edit_example/mask.glb \
#     --source-voxels assets/edit_example/voxels.ply \
#     --case-name test --seed 1 --ss-steps 25 \
#     --model microsoft/TRELLIS-image-large --device cuda:0
# ============================================================

entrypoint: p2p_latent_blend_ss

runtime:
  case_name: test
  model: microsoft/TRELLIS-image-large
  seed: 1
  device: cuda:0
  spconv_algo: native

inputs:
  source_image: assets/edit_example/images/2d_render.png
  edit_image: assets/edit_example/images/2d_edit.png
  mask_image: assets/edit_example/images/2d_mask.png
  mask_glb: assets/edit_example/mask.glb
  source_voxels: assets/edit_example/voxels.ply

preprocess:
  crop_policy: union_crop
  foreground_policy: alpha_or_rembg
  mask_policy: provided

ss:
  sampler:
    steps: 25
