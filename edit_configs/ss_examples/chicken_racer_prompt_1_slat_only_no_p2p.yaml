# ============================================================
# p2p_latent_blend_slat — CHICKEN_RACER_prompt_1 (SLAT only, NO P2P)
#
# 在 TRELLIS_EDIT 目录下:
#   python run_edit_experiment.py --config edit_configs/ss_examples/chicken_racer_prompt_1_slat_only_no_p2p.yaml
#
# 特点：
#   - 只运行 SLAT 阶段
#   - 保留 latent blending
#   - 将 P2P hook 强度显式设为 0.0
# ============================================================

entrypoint: p2p_latent_blend_slat

runtime:
  case_name: CHICKEN_RACER_prompt_1_slat_only_no_p2p
  model: microsoft/TRELLIS-image-large
  seed: 1
  device: cuda:0
  spconv_algo: native

inputs:
  source_image: assets/CHICKEN_RACER_prompt_1/images/2d_render.png
  edit_image: assets/CHICKEN_RACER_prompt_1/images/2d_edit.png
  mask_image: assets/CHICKEN_RACER_prompt_1/images/2d_mask.png
  mask_glb: assets/CHICKEN_RACER_prompt_1/mask.glb
  source_features: assets/CHICKEN_RACER_prompt_1/features.npz
  edited_coords: outputs/p2p_latent_blend_ss/CHICKEN_RACER_prompt_1/edit/ss/coords.ply

preprocess:
  crop_policy: union_crop
  foreground_policy: alpha_or_rembg
  mask_policy: provided

slat:
  sampler:
    steps: 25
  hook:
    t_start: 0.8
    t_end: 0.0
    strength: 0.0
  inversion_mode: simple
  blend_enabled: true
  skip_source_decode: true
