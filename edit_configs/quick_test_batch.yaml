# ============================================================
# 最小批量验证配置
#
# 用法:
#   python run_batch_edit_and_eval.py --config edit_configs/quick_test_batch.yaml --dry-run
#   python run_batch_edit_and_eval.py --config edit_configs/quick_test_batch.yaml
# ============================================================

entrypoint: p2p_latent_blend_full

runtime:
  model: microsoft/TRELLIS-image-large
  seed: 1
  device: cuda:0
  spconv_algo: native
  skip_render: true
  skip_glb: false
  skip_ply: false

preprocess:
  crop_policy: union_crop
  foreground_policy: alpha_or_rembg
  mask_policy: provided

ss:
  sampler:
    steps: 25
  inversion_mode: simple
  blend_enabled: true
  blend_strength: 1.0

slat:
  sampler:
    steps: 25
  inversion_mode: simple
  blend_enabled: true
  skip_source_decode: true

batch:
  config_name: quick_test
  gt_root: /home/wangxinxing/code/Edit3Dpp/data
  assets_root: /cache/wangxinxing/data/temp/renders
  pred_root: /cache/wangxinxing/data/temp/p2p_latent_blend_quick_test
  dataset: GSO
  object: Avengers_Gamma_Green_Smash_Fists
  prompt_id: 3
  max_cases: 1
  metrics:
    - dino_if
    - clip_t
  skip_benchmark_render: false
  skip_exists: false
  keep_case_outputs: false
