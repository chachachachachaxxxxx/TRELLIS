# ============================================================
# Avengers_Gamma_Green_Smash_Fists_prompt_3 的 composable 配置
# 特点：
# - SS 阶段保留 P2P 注入
# - SLAT 阶段把 hook.strength 设为 0.0，近似“仅 SS 注入”
# ============================================================

entrypoint: p2p_latent_blend_full

runtime:
  case_name: A3_ss_p2p_only
  model: microsoft/TRELLIS-image-large
  seed: 1
  device: cuda:0
  spconv_algo: native
  skip_render: true
  skip_glb: false
  skip_ply: false

inputs:
  source_image: assets/Avengers_Gamma_Green_Smash_Fists_prompt_3/images/2d_render.png
  edit_image: assets/Avengers_Gamma_Green_Smash_Fists_prompt_3/images/2d_edit.png
  mask_image: assets/Avengers_Gamma_Green_Smash_Fists_prompt_3/images/2d_mask.png
  mask_glb: assets/Avengers_Gamma_Green_Smash_Fists_prompt_3/mask.glb
  source_voxels: assets/Avengers_Gamma_Green_Smash_Fists_prompt_3/voxels.ply
  source_features: assets/Avengers_Gamma_Green_Smash_Fists_prompt_3/features.npz

preprocess:
  crop_policy: union_crop
  foreground_policy: alpha_or_rembg
  mask_policy: provided

ss:
  sampler:
    steps: 25
  inversion_mode: simple
  blend_enabled: true
  blend_strength: 1.0
  hook:
    t_start: 1.0
    t_end: 0.5
    strength: 0.5
  denoise_cfg_strength: 6.0
  denoise_cfg_interval: [0.5, 1.0]
  inversion_cfg_strength: 5.0
  inversion_cfg_interval: [0.5, 1.0]
  output_format: both
  save_voxel_mesh: true

slat:
  sampler:
    steps: 25
  inversion_mode: simple
  blend_enabled: true
  hook:
    t_start: 0.8
    t_end: 0.5
    strength: 0.0
  skip_source_decode: true
