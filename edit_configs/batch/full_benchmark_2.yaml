# ============================================================
# 完整批量评测示例：UniEdit 全流程
#
# 用法:
#   python run_batch_edit_and_eval.py --config edit_configs/batch/full_benchmark_2.yaml
# ============================================================

entrypoint: uniedit_full

runtime:
  model: microsoft/TRELLIS-image-large
  seed: 1
  device: cuda:0
  spconv_algo: native
  skip_render: true
  skip_glb: false
  skip_ply: false

preprocess:
  crop_policy: union_crop
  foreground_policy: alpha_or_rembg
  mask_policy: provided

ss:
  sampler:
    steps: 25
  omega: 1.0
  cfg_interval: [0.5, 1.0]
  output_format: both
  save_voxel_mesh: true

slat:
  sampler:
    steps: 25
  omega: 1.0
  cfg_interval: [0.5, 1.0]
  stage2_variant: preserve_uniedit
  decode_modes: [gaussian, mesh]

batch:
  config_name: uniedit_full_benchmark
  gt_root: /home/wangxinxing/code/Edit3Dpp/data
  assets_root: /cache/wangxinxing/data/temp/renders
  pred_root: /cache/wangxinxing/data/temp/uniedit_full_benchmark
  metrics:
    - psnr
    - ssim
    - lpips
    - fid
    - dino_if
    - chamfer
    - clip_t
  skip_benchmark_render: false
  skip_exists: false
  keep_case_outputs: false
