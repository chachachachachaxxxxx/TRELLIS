# ============================================================
# 批处理评测配置 - 快速测试（减少步数）
# 用于: run_batch_edit_and_eval.py --config edit_configs/batch/quick_test.yaml
# ============================================================

# -------------------- 数据集配置 --------------------
gt_root: /home/wangxinxing/code/Edit3Dpp/data
max_cases: 5  # 限制案例数量

# -------------------- 方法配置 --------------------
method_name: image_p2p_latent_blend
config_name: quick_test

# -------------------- 运行环境 --------------------
seed: 1
device: cuda:0

# 预处理的 assets（可选）
assets_root: /cache/wangxinxing/data/temp/renders

# -------------------- 评测配置 --------------------
metrics:
  - psnr
  - ssim
  - lpips

skip_render: false

# -------------------- 方法参数 --------------------
# 快速测试：减少步数，禁用 P2P
method_args:
  ss-steps: 12
  slat-steps: 12
  inject-stages: ""
  blend-ss-enabled: true
  blend-slat-enabled: true
  ss-blend-mode: soft
  slat-blend-mode: soft
  ss-soft-kernel-size: 5
  slat-soft-kernel-size: 7
