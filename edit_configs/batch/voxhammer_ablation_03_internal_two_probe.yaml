entrypoint: edit_full

runtime:
  model: microsoft/TRELLIS-image-large
  seed: 42
  device: cuda:0
  attn_backend: sdpa
  sparse_attn_backend: flash_attn
  spconv_algo: native
  skip_render: true
  skip_glb: false
  skip_ply: false

preprocess:
  style: voxhammer
  crop_policy: union_crop
  mask_policy: provided
  adaptive_foreground_scale:
    enabled: true
    strategy: two_probe

ss:
  method: controlled_denoise
  sampler:
    steps: 25
  inversion:
    enabled: true
    denoise_init: inverted_terminal_noise
    solver: voxhammer_rf_solver
    refinement_steps: 0
    refinement_solver: inherit
    denoise_cfg_strength: 6.0
    denoise_cfg_interval: [0.5, 1.0]
    inversion_cfg_strength: 5.0
    inversion_cfg_interval: [0.5, 1.0]
  denoise:
    solver: inherit
  controls:
    p2p:
      enabled: false
    kv_blend:
      enabled: true
      t_start: 1.0
      t_end: 0.0
      self_attention: true
      cross_attention: true
      source_bundle_mode: external_voxhammer
      edit_region_mode: preserve_complement
      soft_mask:
        enabled: false
        dilation: 2
        sigma: 1.0
    latent_blend:
      enabled: true
      strength: 1.0
      hard_mask_mode: edit_all
      edit_region_mode: preserve_complement
      soft_mask:
        enabled: false
        dilation: 2
        sigma: 1.0
    uniedit:
      enabled: false
  output:
    output_format: both
    save_voxel_mesh: true

slat:
  method: controlled_denoise
  sampler:
    steps: 25
  inversion:
    enabled: true
    denoise_init: terminal_noise
    scope: preserve_only
    solver: voxhammer_rf_solver
    refinement_steps: 0
    refinement_solver: inherit
    denoise_cfg_strength: 0.0
    denoise_cfg_interval: [0.5, 1.0]
    inversion_cfg_strength: 0.0
    inversion_cfg_interval: [0.5, 1.0]
  denoise:
    solver: inherit
  controls:
    p2p:
      enabled: false
    kv_blend:
      enabled: true
      t_start: 1.0
      t_end: 0.0
      self_attention: true
      cross_attention: true
      source_bundle_mode: external_voxhammer
      soft_mask:
        enabled: false
        dilation: 2
        sigma: 1.0
    latent_blend:
      enabled: true
      soft_mask:
        enabled: false
        dilation: 2
        sigma: 1.0
    uniedit:
      enabled: false
  decode:
    skip_source_decode: true
    modes: [gaussian, mesh]

batch:
  config_name: voxhammer_ablation_03_internal_two_probe
  group: voxhammer_ablations
  gt_root: /cache/wangxinxing/data/trellis_edit_benchmark/edit3d_data/data
  assets_root: /cache/wangxinxing/data/trellis_edit_benchmark/edit3d_data/renders
  pred_root: /cache/wangxinxing/data/trellis_edit_benchmark/pred/voxhammer_ablation_03_internal_two_probe
  max_cases: 12
  metrics:
    - psnr
    - ssim
    - lpips
    - fid
    - dino_if_max
    - dino_if_mean
    - chamfer
    - clip_t
  skip_benchmark_render: false
  skip_exists: false
  keep_case_outputs: false
  input_templates:
    source_image: "{gt_root}/{dataset}/{object_name}/prompt_{prompt_id}/2d_render.png"
    edit_image: "{gt_root}/{dataset}/{object_name}/prompt_{prompt_id}/2d_edit.png"
    mask_image: "{gt_root}/{dataset}/{object_name}/prompt_{prompt_id}/2d_mask.png"
    mask_glb: "{gt_root}/{dataset}/{object_name}/prompt_{prompt_id}/3d_edit_region.glb"
    source_voxels: "{assets_root}/{dataset}/{object_name}/voxels.ply"
    source_features: "{assets_root}/{dataset}/{object_name}/features.npz"
    edited_coords: ""
