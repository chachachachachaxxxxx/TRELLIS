<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>VoxHammer 体素区域可视化</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #e0e0e0; font-family: 'JetBrains Mono', 'Fira Code', monospace; overflow: hidden; }
  #canvas { display: block; width: 100vw; height: 100vh; }

  #controls {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    background: rgba(10, 10, 20, 0.88); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 20px 24px; min-width: 280px;
    backdrop-filter: blur(16px); box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  #controls h2 {
    font-size: 14px; font-weight: 600; letter-spacing: 1.2px;
    text-transform: uppercase; color: #aaa; margin-bottom: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 10px;
  }

  .layer-row {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 0; cursor: pointer; user-select: none;
    transition: opacity 0.2s;
  }
  .layer-row:hover { opacity: 0.85; }

  .color-dot {
    width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.15);
    transition: box-shadow 0.2s;
  }
  .layer-row:hover .color-dot { box-shadow: 0 0 8px currentColor; }

  .layer-row input[type="checkbox"] { display: none; }
  .layer-row label {
    font-size: 13px; cursor: pointer; flex: 1;
    display: flex; justify-content: space-between; align-items: center;
  }
  .layer-row label .count {
    font-size: 11px; color: #666; font-variant-numeric: tabular-nums;
  }
  .layer-row.off label { color: #555; text-decoration: line-through; }
  .layer-row.off .color-dot { opacity: 0.25; }

  .size-row {
    margin-top: 14px; padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center; gap: 10px;
  }
  .size-row label { font-size: 12px; color: #888; white-space: nowrap; }
  .size-row input[type="range"] {
    flex: 1; accent-color: #6cf;
    height: 3px; background: #333; border-radius: 2px;
  }
  .size-row .val { font-size: 11px; color: #666; width: 32px; text-align: right; }

  #stats {
    position: fixed; bottom: 16px; left: 16px; z-index: 10;
    background: rgba(10, 10, 20, 0.82); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px; padding: 12px 16px; font-size: 11px; color: #666;
    backdrop-filter: blur(12px);
  }
  #stats span { color: #999; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="controls">
  <h2>VoxHammer 体素区域</h2>

  <div class="layer-row" data-layer="source">
    <div class="color-dot" style="background:#4488ff; color:#4488ff;"></div>
    <input type="checkbox" id="cb-source" checked>
    <label for="cb-source">原始体素 (Source) <span class="count" id="cnt-source">—</span></label>
  </div>

  <div class="layer-row" data-layer="delete">
    <div class="color-dot" style="background:#ff4455; color:#ff4455;"></div>
    <input type="checkbox" id="cb-delete" checked>
    <label for="cb-delete">删除区域 (Delete) <span class="count" id="cnt-delete">—</span></label>
  </div>

  <div class="layer-row" data-layer="preserve">
    <div class="color-dot" style="background:#44dd88; color:#44dd88;"></div>
    <input type="checkbox" id="cb-preserve">
    <label for="cb-preserve">保留区域 (Preserve) <span class="count" id="cnt-preserve">—</span></label>
  </div>

  <div class="size-row">
    <label>点大小</label>
    <input type="range" id="point-size" min="1" max="12" step="0.5" value="4">
    <span class="val" id="size-val">4</span>
  </div>
</div>

<div id="stats">
  <span>VoxHammer</span> · 64³ 体素网格 · 鼠标拖拽旋转 · 滚轮缩放
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.160.0",
    "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
  }
}
</script>

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x0a0a0f);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 100);
camera.position.set(0.8, 0.6, 0.8);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);

const gridHelper = new THREE.GridHelper(1, 8, 0x222233, 0x151520);
scene.add(gridHelper);

const axesHelper = new THREE.AxesHelper(0.3);
scene.add(axesHelper);

const wireGeo = new THREE.BoxGeometry(1, 1, 1);
const wireEdges = new THREE.EdgesGeometry(wireGeo);
const wireMat = new THREE.LineBasicMaterial({ color: 0x333344, transparent: true, opacity: 0.3 });
const wireBox = new THREE.LineSegments(wireEdges, wireMat);
wireBox.position.set(0, 0, 0);
scene.add(wireBox);

const LAYERS = {
  source:   { color: new THREE.Color(0x4488ff), points: null, visible: true },
  delete:   { color: new THREE.Color(0xff4455), points: null, visible: true },
  preserve: { color: new THREE.Color(0x44dd88), points: null, visible: false },
};

function buildPointCloud(positions, color, size) {
  const count = positions.length;
  const geo = new THREE.BufferGeometry();
  const posArr = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    posArr[i * 3]     = positions[i][0];
    posArr[i * 3 + 1] = positions[i][1];
    posArr[i * 3 + 2] = positions[i][2];
  }
  geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));

  const mat = new THREE.PointsMaterial({
    color,
    size,
    sizeAttenuation: true,
    transparent: true,
    opacity: 0.85,
    depthWrite: false,
  });
  return new THREE.Points(geo, mat);
}

function buildPointCloudFlat(flatArr, color, size) {
  const count = flatArr.length / 3;
  const geo = new THREE.BufferGeometry();
  const posArr = new Float32Array(flatArr);
  geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  const mat = new THREE.PointsMaterial({
    color,
    size,
    sizeAttenuation: true,
    transparent: true,
    opacity: 0.85,
    depthWrite: false,
  });
  return new THREE.Points(geo, mat);
}

async function loadData() {
  for (const key of ['source', 'delete', 'preserve']) {
    const layer = LAYERS[key];
    const pts = buildPointCloudFlat(
      _VOXEL_DATA[key].flat,
      layer.color,
      currentSize / 200
    );
    pts.visible = layer.visible;
    layer.points = pts;
    scene.add(pts);
    document.getElementById(`cnt-${key}`).textContent = _VOXEL_DATA[key].count.toLocaleString();
  }
  syncUI();
}

function syncUI() {
  for (const key of Object.keys(LAYERS)) {
    const row = document.querySelector(`.layer-row[data-layer="${key}"]`);
    const cb = document.getElementById(`cb-${key}`);
    const layer = LAYERS[key];
    cb.checked = layer.visible;
    if (layer.points) layer.points.visible = layer.visible;
    row.classList.toggle('off', !layer.visible);
  }
}

for (const row of document.querySelectorAll('.layer-row')) {
  row.addEventListener('click', () => {
    const key = row.dataset.layer;
    LAYERS[key].visible = !LAYERS[key].visible;
    syncUI();
  });
}

const sizeSlider = document.getElementById('point-size');
const sizeVal = document.getElementById('size-val');
sizeSlider.addEventListener('input', () => {
  currentSize = parseFloat(sizeSlider.value);
  sizeVal.textContent = currentSize;
  for (const layer of Object.values(LAYERS)) {
    if (layer.points) layer.points.material.size = currentSize / 200;
  }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

loadData().then(() => console.log('Voxel regions loaded'));
animate();
</script>
